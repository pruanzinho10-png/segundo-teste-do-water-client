name: Build Water Client with Java runtime

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Water Client
        uses: actions/checkout@v4

      - name: Checkout pinned Amethyst Android runtime
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: 166af615dbdca1a507b8c2d379822cca02795132
          path: runtime-engine
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Java 8 runtime for Android
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: runtime-engine/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Android NDK
        uses: android-actions/setup-ndk@v3
        with:
          ndk-version: 27.3.13750724

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Detect Water Client source folder
        run: |
          if [ -f water-client-android-preview-source/scripts/prepare-runtime.py ]; then
            echo "WATER_SOURCE_DIR=water-client-android-preview-source" >> "$GITHUB_ENV"
          else
            echo "WATER_SOURCE_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Apply Water Client UI and branding
        run: |
          bash runtime-engine/scripts/languagelist_updater.sh
          python3 "$WATER_SOURCE_DIR/scripts/prepare-runtime.py" runtime-engine

      - name: Build Android APK
        run: gradle -p runtime-engine :app_pojavlauncher:assembleDebug --console=plain

      - name: Upload Water Client APK
        uses: actions/upload-artifact@v4
        with:
          name: water-client-android-debug
          path: runtime-engine/app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk
          if-no-files-found: error
          retention-days: 14
